function pt(x,y,ch){return [[y,x,x,ch]];}

 {name:"Flip Ferry",sub:"Same ride, new rules.",fill:J(FLOOR,R(5,14,26,14,'^'),R(5,12,7,12,'m'),R(24,12,26,12,'n'),pt(2,14,'P'),pt(30,14,'D')),

 {name:"Crusher Alley",sub:"Mind your head. All four times.",fill:J(FLOOR,R(6,7,8,9,'c'),R(11,7,13,9,'d'),R(16,7,18,9,'e'),R(21,9,23,11,'g'),pt(2,14,'P'),pt(30,14,'D')),
  traps:[{g:'c',type:'fall',land:true,delay:4,trig:[5,0,5,14]},{g:'d',type:'fall',land:true,delay:4,trig:[10,0,10,14]},{g:'e',type:'fall',land:true,delay:4,trig:[15,0,15,14]},{g:'g',type:'fall',land:true,delay:0,trig:[20,0,20,14]},{type:'fakedoor',at:[26,14]}]},
 {name:"The Long Lie",sub:"You're so close.",fill:J(FLOOR,R(8,14,22,14,'^'),R(9,12,11,12,'#'),R(13,9,15,9,'a'),R(17,6,19,6,'#'),R(22,5,27,5,'#'),R(24,14,28,14,'4'),pt(2,14,'P'),pt(6,14,'D')),

 {name:"Grand Finale",sub:"Every lie at once.",fill:J(FLOOR,R(4,15,7,17,'a'),R(11,7,13,9,'c'),R(20,14,21,14,'^'),R(23,14,24,14,'5'),R(25,12,26,12,'f'),R(27,9,28,9,'f'),R(29,7,31,7,'f'),pt(1,14,'P'),pt(28,14,'D')),
  traps:[{g:'a',type:'fall',delay:2,trig:[4,0,4,14]},{g:'c',type:'fall',land:true,delay:2,trig:[10,0,10,14]},{type:'fakedoor',at:[16,14]},{type:'invert',trig:[18,0,18,14]},
         {g:'5',type:'spikes',trig:[22,0,22,14]},{type:'invert',trig:[25,0,25,14]},{type:'door',to:[30,6],speed:350,trig:[26,0,27,14]},{g:'f',type:'appear',delay:15,trig:[26,0,27,14]}]},
];

function isSolidCh(c){return c==='#'||(c>='a'&&c<='z');}
function compile(def){
  var rows=[]; for(var y=0;y<GH;y++) rows.push(new Array(GW).fill('.'));
  def.fill.forEach(function(f){for(var x=f[1];x<=f[2];x++) rows[f[0]][x]=f[3];});
  var L={def:def,grid:new Uint8Array(GW*GH),spikes:[],springs:[],groups:{},start:null,door:null,traps:[],rows:rows};
  function grp(c){return L.groups[c]||(L.groups[c]={solids:[],spikes:[],trap:-1});}
  for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){
    var c=rows[y][x];
    var below=y<GH-1?rows[y+1][x]:'.', above=y>0?rows[y-1][x]:'.';
    var down=!isSolidCh(below)&&isSolidCh(above);
    if(c==='#') L.grid[y*GW+x]=1;
    else if(c==='^') L.spikes.push({x:x,y:y,down:down});
    else if(c==='P') L.start={x:x*T+(T-PW)/2,y:(y+1)*T-PHT};
    else if(c==='D') L.door={x:x*T,y:(y-1)*T};
    else if(c==='*') L.springs.push({x:x,y:y});
    else if(c>='a'&&c<='z') grp(c).solids.push([x,y]);
    else if(c>='0'&&c<='9') grp(c).spikes.push({x:x,y:y,down:down});
  }
  def.traps.forEach(function(t,i){
    var tr=Object.assign({},t);
    tr.trig=t.trig?{x:t.trig[0]*T,y:t.trig[1]*T,w:(t.trig[2]-t.trig[0]+1)*T,h:(t.trig[3]-t.trig[1]+1)*T}:null;
    tr.delay=t.delay||0;
    if(t.g){ tr.gs=t.g.split(''); tr.gs.forEach(function(c){grp(c).trap=i;}); }
    if(t.type==='door') tr.tx=t.to[0]*T, tr.ty=(t.to[1]-1)*T;
    if(t.type==='fakedoor'){ tr.fx=t.at[0]*T; tr.fy=(t.at[1]-1)*T; }
    if(t.type==='saw'||t.type==='patrol'){ tr.fx=t.from[0]*T+15; tr.fy=t.from[1]*T+15; tr.txx=t.to[0]*T+15; tr.tyy=t.to[1]*T+15;
      tr.len=Math.hypot(tr.txx-tr.fx,tr.tyy-tr.fy); }
    if(t.type==='fall'&&t.land){ // distance until group hits static ground
      var md=1e9; tr.gs.forEach(function(c){ L.groups[c].solids.forEach(function(s){
        for(var yy=s[1]+1;yy<GH;yy++){ if(L.grid[yy*GW+s[0]]){ md=Math.min(md,(yy-s[1]-1)*T); break; } } }); });
      tr.landAt=md;
    }
    L.traps.push(tr);
  });
  return L;
}
var LEVELS=LEVEL_DEFS.map(compile);

function newState(L){
  return {f:0,p:{x:L.start.x,y:L.start.y,vx:0,vy:0,g:false,co:0,bf:0,pj:false,jc:false,face:1,gm:-1},
    tr:L.traps.map(function(t){return {on:!t.trig,t:t.trig?0:t.delay+1,ox:0,oy:0,vy:0,done:false,dir:1};}),
    door:{x:L.door.x,y:L.door.y},inv:false,dead:false,won:false,cause:'',ev:[]};
}
function cloneState(s){
  return {f:s.f,p:Object.assign({},s.p),tr:s.tr.map(function(t){return Object.assign({},t);}),door:{x:s.door.x,y:s.door.y},
    inv:s.inv,dead:s.dead,won:s.won,cause:s.cause,ev:[]};
}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function prect(p){return {x:p.x,y:p.y,w:PW,h:PHT};}
function active(L,s,i){var t=L.traps[i],st=s.tr[i];return st.on&&st.t>t.delay;}

// Which group tiles are currently solid, with offsets
function groupSolid(L,s,c){
  var g=L.groups[c]; if(g.trap<0) return {on:true,ox:0,oy:0};
  var t=L.traps[g.trap], st=s.tr[g.trap];
  if(t.type==='vanish') return {on:!active(L,s,g.trap),ox:0,oy:0};
  if(t.type==='appear') return {on:active(L,s,g.trap),ox:0,oy:0};
  if(t.type==='spikes') return {on:active(L,s,g.trap),ox:0,oy:0};
  return {on:!st.done||t.land,ox:st.ox,oy:st.oy,ti:g.trap};
}
function moverRects(L,s){
  var out=[]; for(var c in L.groups){ var g=L.groups[c]; if(!g.solids.length) continue; var gs=groupSolid(L,s,c); if(!gs.on) continue;
    for(var k=0;k<g.solids.length;k++){var q=g.solids[k]; out.push({x:q[0]*T+gs.ox,y:q[1]*T+gs.oy,w:T,h:T,ti:gs.ti===undefined?-1:gs.ti});} }
  return out;
}
function solidsNear(L,r,movers){
  var out=[]; var x0=Math.max(0,Math.floor(r.x/T)-1),x1=Math.min(GW-1,Math.floor((r.x+r.w)/T)+1),
      y0=Math.max(0,Math.floor(r.y/T)-1),y1=Math.min(GH-1,Math.floor((r.y+r.h)/T)+1);
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++) if(L.grid[y*GW+x]) out.push({x:x*T,y:y*T,w:T,h:T,ti:-1});
  for(var i=0;i<movers.length;i++){var m=movers[i]; if(m.x<r.x+r.w+T&&m.x+T>r.x-T&&m.y<r.y+r.h+T&&m.y+T>r.y-T) out.push(m);}
  return out;
}
function spikeBox(x,y,down,ox,oy){ return down?{x:x*T+5+ox,y:y*T+oy,w:20,h:15}:{x:x*T+5+ox,y:y*T+15+oy,w:20,h:15}; }
function sawPos(L,s,i){var t=L.traps[i],st=s.tr[i];var k=t.len?Math.min(1,st.ox/t.len):1;return {x:t.fx+(t.txx-t.fx)*k,y:t.fy+(t.tyy-t.fy)*k};}
function kill(s,why){ if(!s.dead&&!s.won){ s.dead=true; s.cause=why; s.ev.push({k:'die',why:why}); } }

// ---- One fixed 1/60 s step. inp = {l,r,j} ----
function step(L,s,inp){
  if(s.dead||s.won) return s;
  s.f++; var p=s.p;
  // traps
  var pr=prect(p), deltas={};
  for(var i=0;i<L.traps.length;i++){
    var t=L.traps[i], st=s.tr[i];
    if(!st.on){ if(t.trig&&ov(pr,t.trig)){ st.on=true; st.t=0; s.ev.push({k:'trap',i:i,type:t.type}); } else continue; }
    st.t++; if(st.t<=t.delay||st.done) continue;
    if(st.t===t.delay+1) s.ev.push({k:'fire',i:i,type:t.type});
    if(t.type==='fall'){ st.vy=Math.min(st.vy+PH.grav*DT,1100); var dy=st.vy*DT;
      if(t.land&&st.oy+dy>=t.landAt){ dy=t.landAt-st.oy; st.done=true; s.ev.push({k:'thud'}); }
      st.oy+=dy; deltas[i]=[0,dy]; if(!t.land&&st.oy>VH+60) st.done=true; }
    else if(t.type==='slide'){ var gx=t.dx*T,gy=t.dy*T,ddx=gx-st.ox,ddy=gy-st.oy,d=Math.hypot(ddx,ddy),m=t.speed*DT;
      if(d<=m){ st.done=true; deltas[i]=[ddx,ddy]; st.ox=gx; st.oy=gy; } else { var mx=ddx/d*m,my=ddy/d*m; st.ox+=mx; st.oy+=my; deltas[i]=[mx,my]; } }
    else if(t.type==='loop'){ var lx=st.dir>0?t.dx*T:0, ly=st.dir>0?t.dy*T:0, ex2=lx-st.ox, ey2=ly-st.oy, d3=Math.hypot(ex2,ey2), m3=t.speed*DT, mx3, my3;
      if(d3<=m3){ mx3=ex2; my3=ey2; st.dir=-st.dir; } else { mx3=ex2/d3*m3; my3=ey2/d3*m3; } st.ox+=mx3; st.oy+=my3; deltas[i]=[mx3,my3]; }
    else if(t.type==='patrol'){ st.ox+=t.speed*DT*st.dir; if(st.ox>=t.len){ st.ox=t.len; st.dir=-1; } if(st.ox<=0){ st.ox=0; st.dir=1; } }
    else if(t.type==='door'){ var ex=t.tx-s.door.x,ey=t.ty-s.door.y,dd=Math.hypot(ex,ey),mm=t.speed*DT;
      if(dd<=mm){ s.door.x=t.tx; s.door.y=t.ty; st.done=true; } else { s.door.x+=ex/dd*mm; s.door.y+=ey/dd*mm; } }
    else if(t.type==='saw'){ st.ox+=t.speed*DT; if(st.ox>=t.len){ st.ox=t.len; st.done=true; } }
    else if(t.type==='invert'){ s.inv=!s.inv; st.done=true; }
  }
  var movers=moverRects(L,s);
  // carry + push by moving groups
  if(p.g&&p.gm>=0&&deltas[p.gm]){ p.x+=deltas[p.gm][0]; p.y+=deltas[p.gm][1]; }
  for(var mi=0;mi<movers.length;mi++){ var mr=movers[mi], d2=deltas[mr.ti]; if(!d2) continue; pr=prect(p);
    if(ov(pr,mr)){ if(d2[1]>0) p.y=mr.y+T; else if(d2[1]<0){p.y=mr.y-PHT;p.vy=Math.min(p.vy,0);} else if(d2[0]>0) p.x=mr.x+T; else if(d2[0]<0) p.x=mr.x-PW; } }
  var near=solidsNear(L,prect(p),movers);
  for(var a=0;a<near.length;a++) if(ov(prect(p),near[a])){ kill(s,'squish'); return s; }

  // input
  var ix=((inp.r?1:0)-(inp.l?1:0))*(s.inv?-1:1);
  if(ix){ var acc=p.g?PH.accG:PH.accA, tg=ix*PH.run; p.vx=p.vx<tg?Math.min(tg,p.vx+acc*DT):Math.max(tg,p.vx-acc*DT); p.face=ix; }
  else { var de=(p.g?PH.decG:PH.decA)*DT; p.vx=Math.abs(p.vx)<=de?0:p.vx-Math.sign(p.vx)*de; }
  if(inp.j&&!p.pj) p.bf=PH.buffer;
  p.co=p.g?PH.coyote:Math.max(0,p.co-1);
  if(p.bf>0&&p.co>0){ p.vy=-PH.jump; p.g=false; p.co=0; p.bf=0; p.jc=true; s.ev.push({k:'jump'}); }
  else p.bf=Math.max(0,p.bf-1);
  if(!inp.j&&p.jc&&p.vy<0){ p.vy*=PH.cut; p.jc=false; }
  if(p.vy>=0) p.jc=false;
  p.vy=Math.min(p.vy+PH.grav*DT,PH.maxFall); p.pj=!!inp.j;

  // move X
  p.x+=p.vx*DT; if(p.x<0){p.x=0;p.vx=0;} if(p.x>VW-PW){p.x=VW-PW;p.vx=0;}
  near=solidsNear(L,prect(p),movers);
  for(var b=0;b<near.length;b++){ var r=near[b]; if(ov(prect(p),r)){

function frame(now){
  var dt=last?Math.min(0.1,(now-last)/1000):0; last=now;
  var blocked=portraitBlocked();
  if(blocked){ if(SDK.playing) SDK.stop(); keys={l:false,r:false,j:false,t:false}; pointers={}; touchZones(); }
  else if(mode==='play'&&started&&!SDK.playing&&!SDK.inAd&&!S.won&&!document.hidden) SDK.start();
  if(mode==='play'&&!document.hidden&&!blocked){ acc+=dt; var n=0; while(acc>=DT&&n<6){ tick(); acc-=DT; n++; } if(n>=6) acc=0; }
  else { acc=0; if(trans){ trans.t++; if(trans.t===trans.mid) trans.fn(); if(trans.t>=trans.end) trans=null; } }
  if(shake>0) shake=Math.max(0,shake-dt*40);
